# Non-mutating staging attestation controller. The evidence input is selected
# by generation plus independently recorded canonical hash; the output is a
# new write-once promotion object.
substitutions:
  _IMAGE_DIGEST: ""
  _EVIDENCE_SHA: ""
  _EVIDENCE_MANIFEST_URI: ""   # gs://...#<generation>
  _EVIDENCE_MANIFEST_HASH: ""

steps:
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'fetch-evidence'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        [[ "${_EVIDENCE_MANIFEST_URI}" =~ ^gs://[a-z0-9][a-z0-9._-]*/[^#]+#[1-9][0-9]*$ ]] || {
          echo "STOP: evidence manifest sin generation numérica" >&2
          exit 1
        }
        [[ "${_EVIDENCE_MANIFEST_HASH}" =~ ^[0-9a-f]{64}$ ]]
        gcloud storage cp "${_EVIDENCE_MANIFEST_URI}" \
          /workspace/evidence_manifest.json
        python3 - <<'PY' > /workspace/artifact_uris.tsv
        import json

        names = (
            "ci_provenance", "sbom", "scan", "staging_revisions", "e2e",
            "differential", "semantic_review", "rollback",
        )
        with open("/workspace/evidence_manifest.json", encoding="utf-8") as fh:
            manifest = json.load(fh)
        for name in names:
            uri = manifest.get(f"{name}_uri")
            if not isinstance(uri, str):
                raise SystemExit(f"STOP: falta URI de {name}")
            print(f"{name}\t{uri}")
        PY
        while IFS=$$'\t' read -r name uri; do
          [[ "$$uri" =~ ^gs://[a-z0-9][a-z0-9._-]*/[^#]+#[1-9][0-9]*$$ ]] || {
            echo "STOP: $$name no tiene generation numérica" >&2
            exit 1
          }
          gcloud storage cp "$$uri" "/workspace/$$name.json"
        done < /workspace/artifact_uris.tsv

  - name: 'python:3.12-slim@sha256:64695412729fbe8cf054511723820c82bbe5a077d4a6b4070cd4a7225d3422ce'
    id: 'attest'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        cd /workspace/kb-rag-system
        python scripts/verify_evidence_manifest.py \
          --manifest /workspace/evidence_manifest.json \
          --expected-manifest-hash "${_EVIDENCE_MANIFEST_HASH}" \
          --expected-evidence-sha "${_EVIDENCE_SHA}" \
          --expected-main-sha "$COMMIT_SHA" \
          --expected-image-digest "${_IMAGE_DIGEST}" \
          --expected-controller-builder-digest \
            'python:3.12-slim@sha256:64695412729fbe8cf054511723820c82bbe5a077d4a6b4070cd4a7225d3422ce' \
          --artifact ci_provenance=/workspace/ci_provenance.json \
          --artifact sbom=/workspace/sbom.json \
          --artifact scan=/workspace/scan.json \
          --artifact staging_revisions=/workspace/staging_revisions.json \
          --artifact e2e=/workspace/e2e.json \
          --artifact differential=/workspace/differential.json \
          --artifact semantic_review=/workspace/semantic_review.json \
          --artifact rollback=/workspace/rollback.json
        python scripts/create_promotion_manifest.py \
          --evidence-manifest /workspace/evidence_manifest.json \
          --evidence-manifest-uri "${_EVIDENCE_MANIFEST_URI}" \
          --controller-builder-digest \
            'python:3.12-slim@sha256:64695412729fbe8cf054511723820c82bbe5a077d4a6b4070cd4a7225d3422ce' \
          --out /workspace/promotion.json \
          > /workspace/promotion_hash.txt

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'upload-promotion'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        object="gs://rag-kb-system-ticket-evidence-900340137010/promotions/$COMMIT_SHA/$BUILD_ID/promotion.json"
        gcloud storage cp --if-generation-match=0 \
          /workspace/promotion.json "$$object"
        generation="$(gcloud storage objects describe "$$object" \
          --format='value(generation)')"
        [[ "$$generation" =~ ^[1-9][0-9]*$ ]]
        printf 'PROMOTION_URI=%s#%s\n' "$$object" "$$generation"
        printf 'PROMOTION_HASH=%s\n' "$(cat /workspace/promotion_hash.txt)"

options:
  logging: CLOUD_LOGGING_ONLY
