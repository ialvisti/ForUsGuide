# CI de rama/PR (plan de finalización, Tarea 12 Paso 1). Este build NO
# despliega: Terraform es el único controlador de Cloud Run. Corre con una SA
# sin Run Admin / IAM Admin / acceso a state de producción.
#
# Digests de imágenes-herramienta: kb-rag-system/ci/tool-images.env
# (python:3.12-slim y anchore/syft fijados por @sha256:). No usar :latest.
substitutions:
  _PYTHON_IMAGE: "python:3.12-slim@sha256:64695412729fbe8cf054511723820c82bbe5a077d4a6b4070cd4a7225d3422ce"
  _SYFT_IMAGE: "anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb"
  _EVIDENCE_BUCKET: "rag-kb-system-ticket-evidence-900340137010"

steps:
  # 1) instalar desde el dev lock con hashes (Python 3.12)
  # 2) pytest CI (excluye markers live) + collect-only (markers/imports rotos)
  # 3) ruff + mypy --strict sobre los módulos ticket declarados
  # 4) pip check + pip-audit contra el lock
  # 5) detect-secrets con baseline revisada
  - name: '${_PYTHON_IMAGE}'
    id: 'gates'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        cd kb-rag-system
        python -m pip install --no-cache-dir --require-hashes -r requirements-dev.lock
        python -m pytest -q -rs -m "not live_dependencies and not staging_e2e"
        python -m pytest --collect-only -q >/dev/null
        ruff check .
        mypy
        python -m pip check
        pip-audit --strict --require-hashes -r requirements.lock
        detect-secrets scan --baseline .secrets.baseline

  # 6) construir la imagen inmutable (sin tag mutable)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    dir: 'kb-rag-system'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$SHORT_SHA'
      - '.'

  # 7) smoke de prompts/app a nivel de IMAGEN
  - name: 'gcr.io/cloud-builders/docker'
    id: 'container-smoke'
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'python'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$SHORT_SHA'
      - 'scripts/container_smoke.py'

  # 8) push por SHA (la imagen se declara en `images:` para registrar artefacto)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$SHORT_SHA'

  # 9) resolver DIGEST y generar SBOM Syft sobre ESE digest → evidencia
  - name: 'gcr.io/cloud-builders/docker'
    id: 'resolve-digest'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        DIGEST=$(docker image inspect \
          --format='{{index .RepoDigests 0}}' \
          us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$SHORT_SHA)
        echo -n "$DIGEST" > /workspace/image_digest.txt
        echo "resolved: $DIGEST"

  - name: '${_SYFT_IMAGE}'
    id: 'sbom'
    entrypoint: sh
    args:
      - '-c'
      - |
        set -eu
        DIGEST=$(cat /workspace/image_digest.txt)
        syft "$DIGEST" -o spdx-json > /workspace/sbom.spdx.json

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'upload-sbom'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        gsutil cp /workspace/sbom.spdx.json \
          gs://${_EVIDENCE_BUCKET}/ci/$SHORT_SHA/sbom.spdx.json

  # 10) analizar ESE digest con On-Demand Scanning; CRITICAL bloquea sin
  # excepción; cada HIGH requiere G5V por digest+CVE aún vigente.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'scan'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        DIGEST=$(cat /workspace/image_digest.txt)
        gcloud artifacts docker images scan "$DIGEST" \
          --location=us-central1 --format='value(response.scan)' \
          > /workspace/scan_id.txt || true
        # el gate de severidad se evalúa en el análisis del scan (script
        # dedicado en el trigger); un CRITICAL debe fallar el build.

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

# Registrar el artefacto por SHA (nunca :latest). El digest promovido se
# resuelve del push; una scan anterior al push no cuenta como evidencia.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$SHORT_SHA'
