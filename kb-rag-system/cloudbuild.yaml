# CI de rama/PR (plan de finalización, Tarea 12 Paso 1). Este build NO
# despliega: Terraform es el único controlador de Cloud Run. Corre con una SA
# sin Run Admin / IAM Admin / acceso a state de producción.
#
# Digests de imágenes-herramienta: kb-rag-system/ci/tool-images.env
# (python:3.12-slim y anchore/syft fijados por @sha256:). No usar :latest.
substitutions:
  _EVIDENCE_BUCKET: "rag-kb-system-ticket-evidence-900340137010"
  _SCAN_LOCATION: "us"

steps:
  # 1) instalar desde el dev lock con hashes (Python 3.12)
  # 2) pytest CI (excluye markers live) + collect-only (markers/imports rotos)
  # 3) ruff + mypy --strict sobre los módulos ticket declarados
  # 4) pip check + pip-audit contra el lock
  # 5) detect-secrets con baseline revisada
  - name: 'python:3.12-slim@sha256:64695412729fbe8cf054511723820c82bbe5a077d4a6b4070cd4a7225d3422ce'
    id: 'gates'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        cd kb-rag-system
        python -m pip install --no-cache-dir --require-hashes -r requirements-dev.lock
        detect-secrets scan --all-files . \
          --no-verify \
          --exclude-files '\.venv/.*' \
          --exclude-files '\.pytest_cache/.*' \
          --exclude-files '\.mypy_cache/.*' \
          --exclude-files '\.ruff_cache/.*' \
          --exclude-files '^\.secrets\.baseline$' \
          --exclude-files '__pycache__/.*' \
          --exclude-files 'rag-testing/stress_test_results.*' \
          | python -m json.tool \
          > /workspace/candidate-secrets.baseline
        python scripts/verify_secrets_baseline.py \
          --approved .secrets.baseline \
          --candidate /workspace/candidate-secrets.baseline \
          --scan-root .
        detect-secrets scan --all-files --no-verify \
          ../PA "../External agents" \
          ../docs/verification/handle-ticket/11-incident-drill-template.md \
          | python -m json.tool \
          > /workspace/external-input-secrets.json
        python scripts/verify_secrets_baseline.py \
          --candidate /workspace/external-input-secrets.json \
          --require-empty
        python -m pytest -q -rs -m "not live_dependencies and not staging_e2e"
        python -m pytest --collect-only -q >/dev/null
        ruff check .
        mypy
        python -m pip check
        pip-audit --strict --require-hashes -r requirements.lock

  # 6) construir la imagen inmutable (sin tag mutable)
  - name: 'gcr.io/cloud-builders/docker@sha256:6c9b879570fe1c63a78af0b575ca5ac52f6c2c7e25f76f91ae1f2d6cb2a872ee'
    id: 'build'
    dir: 'kb-rag-system'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'
      - '.'

  # 7) smoke de prompts/app a nivel de IMAGEN
  - name: 'gcr.io/cloud-builders/docker@sha256:6c9b879570fe1c63a78af0b575ca5ac52f6c2c7e25f76f91ae1f2d6cb2a872ee'
    id: 'container-smoke'
    args:
      - 'run'
      - '--rm'
      - '--network=none'
      - '--workdir=/app'
      - '--volume'
      - '/workspace/kb-rag-system/scripts/container_smoke.py:/opt/container-smoke.py:ro'
      - '--env'
      - 'PYTHONPATH=/app'
      - '--entrypoint'
      - 'python'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'
      - '/opt/container-smoke.py'

  # 8) push por SHA (la imagen se declara en `images:` para registrar artefacto)
  - name: 'gcr.io/cloud-builders/docker@sha256:6c9b879570fe1c63a78af0b575ca5ac52f6c2c7e25f76f91ae1f2d6cb2a872ee'
    id: 'push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'

  # 9) resolver DIGEST y generar SBOM Syft sobre ESE digest → evidencia
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'resolve-digest'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        TAG='us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'
        DIGEST=$$(gcloud artifacts docker images describe "$$TAG" \
          --format='value(image_summary.fully_qualified_digest)')
        REPOSITORY="$${TAG%:*}"
        DIGEST_PART="$${DIGEST#"$$REPOSITORY"@}"
        test "$$DIGEST_PART" != "$$DIGEST"
        [[ "$$DIGEST_PART" =~ ^sha256:[0-9a-f]{64}$$ ]]
        printf '%s' "$$DIGEST" > /workspace/image_digest.txt
        echo "resolved immutable registry digest: $$DIGEST"

  - name: 'anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb'
    id: 'sbom'
    entrypoint: '/syft'
    args:
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'
      - '-o'
      - 'spdx-json=/workspace/sbom.spdx.json'

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'upload-sbom'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud storage cp --if-generation-match=0 \
          /workspace/sbom.spdx.json \
          gs://${_EVIDENCE_BUCKET}/runtime/$COMMIT_SHA/sbom.spdx.json

  # 10) analizar ESE digest con On-Demand Scanning; CRITICAL bloquea sin
  # excepción; cada HIGH requiere G5V por digest+CVE aún vigente.
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'scan'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        DIGEST=$$(cat /workspace/image_digest.txt)
        SCAN_NAME=$$(gcloud artifacts docker images scan "$$DIGEST" \
          --remote --location="${_SCAN_LOCATION}" \
          --format='value(response.scan)')
        test -n "$$SCAN_NAME"
        printf '%s' "$$SCAN_NAME" > /workspace/scan_id.txt
        gcloud artifacts docker images list-vulnerabilities "$$SCAN_NAME" \
          --location="${_SCAN_LOCATION}" --format=json \
          > /workspace/scan-vulnerabilities.json
        python3 kb-rag-system/scripts/verify_container_scan.py \
          --scan-json /workspace/scan-vulnerabilities.json \
          --image-digest "$$DIGEST" \
          --report-out /workspace/scan-policy.json

  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:577.0.0@sha256:1ccec754a72b81280b047f476e92771afbef26b3072f3798937fc39101f7a60a'
    id: 'upload-scan-evidence'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud storage cp --if-generation-match=0 \
          /workspace/scan-vulnerabilities.json \
          gs://${_EVIDENCE_BUCKET}/runtime/$COMMIT_SHA/scan-vulnerabilities.json
        gcloud storage cp --if-generation-match=0 \
          /workspace/scan-policy.json \
          gs://${_EVIDENCE_BUCKET}/runtime/$COMMIT_SHA/scan-policy.json

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

# Registrar el artefacto por SHA (nunca :latest). El digest promovido se
# resuelve del push; una scan anterior al push no cuenta como evidencia.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kb-rag/kb-rag-system:$COMMIT_SHA'
