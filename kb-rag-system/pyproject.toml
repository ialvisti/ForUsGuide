# Configuración de tooling (plan Tarea 3 Paso 2). No es un paquete instalable:
# el deploy usa requirements.lock; esto sólo gobierna ruff/mypy en CI.

[tool.ruff]
target-version = "py312"
line-length = 100
# Scope explícito: módulos del flujo de tickets + API. El resto del repo
# entra por PRs separados para no mezclar el endurecimiento con limpieza.
include = [
    "api/**/*.py",
    "data_pipeline/ticket_*.py",
    "data_pipeline/article_processor.py",
    "data_pipeline/execution_logger.py",
    "data_pipeline/forusbots_*.py",
    "data_pipeline/inquiry_router.py",
    "data_pipeline/json_parsing.py",
    "data_pipeline/llm_router.py",
    "data_pipeline/pinecone_uploader.py",
    "data_pipeline/rag_engine.py",
    "data_pipeline/retrieval_privacy.py",
    "data_pipeline/staging_fault_injection.py",
    "scripts/container_smoke.py",
    "scripts/create_*manifest.py",
    "scripts/release_controller.py",
    "scripts/requeue_ticket_job.py",
    "scripts/run_staging_gate.py",
    "scripts/smoke_deployed_ticket.py",
    "scripts/verify_container_scan.py",
    "scripts/verify_*manifest.py",
    "scripts/verify_secrets_baseline.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "ASYNC"]
ignore = [
    "E501",   # línea larga: el codebase existente usa 100+ en docstrings
    "S101",   # assert: permitido fuera de producción (uvicorn no usa -O)
]

[tool.ruff.lint.per-file-ignores]
# Imports follow load_dotenv() intentionally, and Depends() defaults are the
# canonical FastAPI declaration pattern.
"api/main.py" = ["E402", "B008"]
# Los seams de test inyectan credenciales sintéticas.
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
# Scope explícito (mismos módulos que ruff); ignore_errors está PROHIBIDO.
files = [
    "api/auth.py",
    "api/config.py",
    "api/metrics.py",
    "api/models.py",
    "api/participant_plan.py",
    "api/rate_limit.py",
    "api/ticket_worker.py",
    "data_pipeline/ticket_job_models.py",
    "data_pipeline/ticket_job_repository.py",
    "data_pipeline/ticket_task_queue.py",
    "data_pipeline/ticket_reconciler.py",
    "data_pipeline/staging_fault_injection.py",
    "scripts/container_smoke.py",
    "scripts/create_e2e_image_manifest.py",
    "scripts/smoke_deployed_ticket.py",
    "scripts/verify_container_scan.py",
    "scripts/verify_secrets_baseline.py",
]

# Sólo SDKs sin stubs publicados; nunca ignore_errors.
[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "google.api_core.*",
    "google.auth.*",
    "google.oauth2.*",
    "pinecone.*",
]
ignore_missing_imports = true

# Keep the strict gate scoped to the files listed above. These legacy RAG
# modules are consumed through typed ticket-facing seams but have their own
# gradual-typing backlog; importing them must not silently expand this gate.
[[tool.mypy.overrides]]
module = [
    "api.main",
    "data_pipeline.execution_logger",
    "data_pipeline.forusbots_client",
    "data_pipeline.gr_payload_builder",
    "data_pipeline.llm_router",
    "data_pipeline.pinecone_uploader",
    "data_pipeline.prompts",
    "data_pipeline.rag_engine",
    "data_pipeline.ticket_orchestrator",
    "data_pipeline.token_manager",
]
follow_imports = "skip"
