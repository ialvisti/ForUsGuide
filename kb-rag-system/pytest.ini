[pytest]
# Pytest configuration for KB RAG System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
    live_dependencies: Pruebas que tocan dependencias reales (TLS/health/Pinecone read-only sin gate; submit/poll con efectos solo tras G4). CI las excluye con -m "not live_dependencies and not staging_e2e".
    staging_e2e: Matriz E2E que corre contra staging real (Run Job ticket-e2e-staging, gate G2/G4). Nunca corre en PR CI.

# Coverage (if pytest-cov is installed)
# addopts = --cov=data_pipeline --cov=api --cov-report=html --cov-report=term

# Test paths
testpaths = tests

# Async tests
asyncio_mode = auto
